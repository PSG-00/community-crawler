name: Deploy Community Crawler & Search Web

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Virtualenv & Dependencies
        run: |
          sudo timedatectl set-timezone Asia/Seoul || true
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Initialize DB & Indexes
        run: |
          ./venv/bin/python3 database.py

      - name: Register & Start Systemd Services
        run: |
          WORKDIR="$GITHUB_WORKSPACE"
          VENV_PYTHON="$WORKDIR/venv/bin/python3"
          VENV_UVICORN="$WORKDIR/venv/bin/uvicorn"

          # 1. dc-crawler.service 생성
          sudo bash -c "cat << 'EOF' > /etc/systemd/system/dc-crawler.service
          [Unit]
          Description=DC Inside Crawler Service
          After=network.target postgresql.service

          [Service]
          User=ubuntu
          WorkingDirectory=\$WORKDIR
          ExecStart=\$VENV_PYTHON crawler.py
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF"
          # 변수 치환
          sudo sed -i "s|\\\$WORKDIR|$WORKDIR|g" /etc/systemd/system/dc-crawler.service
          sudo sed -i "s|\\\$VENV_PYTHON|$VENV_PYTHON|g" /etc/systemd/system/dc-crawler.service

          # 2. dc-web.service 생성
          sudo bash -c "cat << 'EOF' > /etc/systemd/system/dc-web.service
          [Unit]
          Description=DC Inside Search Web Application
          After=network.target postgresql.service

          [Service]
          User=ubuntu
          WorkingDirectory=\$WORKDIR
          ExecStart=\$VENV_UVICORN app:app --host 0.0.0.0 --port 80
          Restart=always
          RestartSec=5
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE

          [Install]
          WantedBy=multi-user.target
          EOF"
          # 변수 치환
          sudo sed -i "s|\\\$WORKDIR|$WORKDIR|g" /etc/systemd/system/dc-web.service
          sudo sed -i "s|\\\$VENV_UVICORN|$VENV_UVICORN|g" /etc/systemd/system/dc-web.service

          # 3. 서비스 활성화 및 재시작 (터널 포함)
          sudo systemctl daemon-reload
          sudo systemctl enable dc-crawler.service dc-web.service dc-tunnel.service 2>/dev/null || true
          sudo systemctl restart dc-crawler.service dc-web.service
          sudo systemctl restart dc-tunnel.service 2>/dev/null || (sudo pkill -f "cloudflared tunnel" 2>/dev/null; nohup cloudflared tunnel --url http://localhost:80 > /tmp/tunnel.log 2>&1 &)

      - name: Verify Service Status & Extract Tunnel URL
        run: |
          sleep 4
          sudo systemctl is-active --quiet dc-crawler.service && CRAWLER_STATUS="OK (정상 동작 중)" || CRAWLER_STATUS="FAIL (중단됨)"
          sudo systemctl is-active --quiet dc-web.service && WEB_STATUS="OK (80포트 서비스 중)" || WEB_STATUS="FAIL (중단됨)"
          
          HTTPS_URL=""
          for i in {1..20}; do
            HTTPS_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | tail -n 1)
            if [ -n "$HTTPS_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "CRAWLER_STATUS=$CRAWLER_STATUS" >> $GITHUB_ENV
          echo "WEB_STATUS=$WEB_STATUS" >> $GITHUB_ENV
          echo "HTTPS_URL=${HTTPS_URL:-https://(터널 생성 지연 - 잠시 후 확인)}" >> $GITHUB_ENV

      - name: Send Discord Deployment Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL 시크릿이 설정되지 않아 디스코드 전송을 건너뜁니다."
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=%an)
          
          if [ "${{ job.status }}" == "success" ]; then
            EMBED_COLOR=3066993 # Green
            STATUS_EMOJI="🚀"
            DEPLOY_TITLE="배포 성공 및 서비스 시작 알림"
          else
            EMBED_COLOR=15158332 # Red
            STATUS_EMOJI="❌"
            DEPLOY_TITLE="배포 실패 알림"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "username": "배포 알리미 (Deploy Bot)",
            "avatar_url": "https://cdn-icons-png.flaticon.com/512/906/906377.png",
            "embeds": [
              {
                "title": "$STATUS_EMOJI $DEPLOY_TITLE",
                "color": $EMBED_COLOR,
                "fields": [
                  {
                    "name": "🌐 바뀐 접속 사이트 주소 (HTTPS)",
                    "value": "👉 [${HTTPS_URL}](${HTTPS_URL})",
                    "inline": false
                  },
                  {
                    "name": "⚙️ 웹 서버 상태 (dc-web)",
                    "value": "\`$WEB_STATUS\`",
                    "inline": true
                  },
                  {
                    "name": "🕷️ 크롤러 상태 (dc-crawler)",
                    "value": "\`$CRAWLER_STATUS\`",
                    "inline": true
                  },
                  {
                    "name": "📝 최신 커밋",
                    "value": "\`$COMMIT_HASH\` - $COMMIT_MSG (by $AUTHOR)",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "GitHub Actions Auto Deploy • $(date '+%Y-%m-%d %H:%M:%S KST')"
                }
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
